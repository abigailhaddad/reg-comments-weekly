name: Website and RSS feed

# Publishes every digest in digests/ as a web page, plus an index and feed.xml (RSS 2.0),
# to the Cloudflare Pages project named by the CLOUDFLARE_PROJECT variable (default
# reg-comments-weekly), served at https://reg-comments-weekly.abigailhaddad.com/
# Runs after each weekly run (whatever its outcome: it publishes what is on main), on
# pushes that change digests/ or the builder, and by hand. A push made by the weekly job's
# GITHUB_TOKEN does not trigger `push`, hence workflow_run.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the same ones ota-watch uses).
# Variable (optional): CLOUDFLARE_PROJECT.

on:
  workflow_run:
    workflows: ["Weekly comment counts"]
    types: [completed]
  push:
    branches: [main]
    paths: ["digests/*.md", "src/build_site.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # page dates come from when each digest was first committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install markdown-it-py==4.3.0 nh3==0.3.7

      - name: Build the site
        run: |
          python src/build_site.py --out _site \
            --title "Regulations.gov comments, weekly" \
            --description "Which Regulations.gov dockets drew comments each week: the busiest, new ones, sudden jumps, and comment periods about to close. Counts come from the spicy-regs mirror. Unofficial; not affiliated with Regulations.gov." \
            --site-url "https://reg-comments-weekly.abigailhaddad.com/" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          python -c "import xml.etree.ElementTree as ET; ET.parse('_site/feed.xml')"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.42.0"
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PROJECT || 'reg-comments-weekly' }} --branch=main
